<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Calendar (MVP)</title>

  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background:#0b0b0b; color:#fff; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
    .card { background:#151515; border:1px solid #2a2a2a; border-radius: 14px; padding: 12px; }
    .row { display:flex; gap:10px; }
    input[type="text"] { flex:1; padding: 12px; border-radius: 12px; border:1px solid #2a2a2a; background:#0f0f0f; color:#fff; }
    button { padding: 12px 14px; border-radius: 12px; border:0; background:#2b6fff; color:#fff; font-weight:600; }
    .muted { color:#b7b7b7; font-size: 13px; line-height: 1.4; }
    .chat { display:flex; flex-direction:column; gap:10px; margin-top: 12px; }
    .bubble { padding: 10px 12px; border-radius: 14px; max-width: 90%; white-space: pre-wrap; }
    .me { align-self:flex-end; background:#2b6fff; }
    .sys { align-self:flex-start; background:#222; border:1px solid #2a2a2a; }
    h2 { margin: 18px 0 8px; font-size: 16px; }
    .todo { display:flex; align-items:center; gap:10px; padding: 10px; border-radius: 12px; background:#101010; border:1px solid #232323; }
    .todo input { flex:0; width:18px; height:18px; }
    .spacer { height: 12px; }
    code { background:#0f0f0f; padding:2px 6px; border-radius: 8px; border:1px solid #2a2a2a; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="muted">
        Type a command in chat. For now we support Layer 2 chores:
        <br><code>chore: water plant / 3m / every 4d</code>
        <br><code>chore: clip nails / 10m / every 14d</code>
      </div>

      <div class="spacer"></div>

      <div class="row">
        <input id="msg" type="text" placeholder='e.g. chore: water plant / 3m / every 4d' />
        <button id="send">Send</button>
      </div>

      <div id="chat" class="chat"></div>

      <h2>Today (checkboxes)</h2>
      <div id="today"></div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
